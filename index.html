<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>TODO</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <input id="new-todo-title" type="text" placeholder="やることを入力して Enter" maxlength="200" aria-label="新しいTODO" required>
      <input id="new-todo-due" type="date" aria-label="期限（任意）">
      <button type="submit">追加</button>
    </form>

    <div class="toolbar">
      <label class="toggle-all">
        <input id="toggle-all" type="checkbox">
        <span>すべて完了にする</span>
      </label>
      <nav class="filters" aria-label="表示の絞り込み">
        <button type="button" data-filter="all" class="is-active">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="completed">完了済み</button>
      </nav>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty" id="empty">TODOはありません</p>

    <footer class="app-footer">
      <span id="count"></span>
      <button type="button" id="clear-completed" class="link-button">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集 ・ Esc で編集をキャンセル</p>
  </main>

  <template id="todo-item-template">
    <li class="todo-item">
      <input class="todo-check" type="checkbox" aria-label="完了">
      <div class="todo-body">
        <span class="todo-title"></span>
        <span class="todo-due"></span>
      </div>
      <button type="button" class="todo-delete" aria-label="削除">×</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
